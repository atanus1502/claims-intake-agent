[project]
name = "claims-intake"
version = "0.1.0"
description = "LangGraph and Claude agent that reads claim emails and attachments, checks policy coverage, and routes simple claims to fast-track."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10", "reportlab>=4"]

[project.scripts]
claims = "claims.cli:main"
claims-eval = "claims.eval:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["claims*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
